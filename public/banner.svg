<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Code Typewriter banner">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06080f"/>
      <stop offset="100%" stop-color="#111623"/>
    </linearGradient>
    <linearGradient id="topBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#58a6ff" stop-opacity="1"/>
      <stop offset="75%"  stop-color="#3fb950" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>

  <!-- Subtle grid -->
  <g stroke="#1c2438" stroke-width="0.5" opacity="0.5">
    <line x1="0"    y1="40"  x2="1200" y2="40"/>
    <line x1="0"    y1="80"  x2="1200" y2="80"/>
    <line x1="0"    y1="120" x2="1200" y2="120"/>
    <line x1="0"    y1="160" x2="1200" y2="160"/>
    <line x1="0"    y1="200" x2="1200" y2="200"/>
    <line x1="0"    y1="240" x2="1200" y2="240"/>
    <line x1="0"    y1="280" x2="1200" y2="280"/>
    <line x1="0"    y1="320" x2="1200" y2="320"/>
    <line x1="0"    y1="360" x2="1200" y2="360"/>
    <line x1="100"  y1="0"   x2="100"  y2="400"/>
    <line x1="200"  y1="0"   x2="200"  y2="400"/>
    <line x1="300"  y1="0"   x2="300"  y2="400"/>
    <line x1="400"  y1="0"   x2="400"  y2="400"/>
    <line x1="500"  y1="0"   x2="500"  y2="400"/>
    <line x1="600"  y1="0"   x2="600"  y2="400"/>
    <line x1="700"  y1="0"   x2="700"  y2="400"/>
    <line x1="800"  y1="0"   x2="800"  y2="400"/>
    <line x1="900"  y1="0"   x2="900"  y2="400"/>
    <line x1="1000" y1="0"   x2="1000" y2="400"/>
    <line x1="1100" y1="0"   x2="1100" y2="400"/>
  </g>

  <!-- Top accent bar -->
  <rect width="1200" height="3" fill="url(#topBar)"/>

  <!-- ── Code editor mockup ──────────────────────────────── -->
  <!-- Window frame -->
  <rect x="220" y="44" width="760" height="120" rx="8" fill="#111623" stroke="#1c2438" stroke-width="1"/>
  <!-- Titlebar -->
  <rect x="220" y="44" width="760" height="30" rx="8" fill="#161c2e"/>
  <rect x="220" y="60" width="760" height="14" fill="#161c2e"/>
  <!-- Traffic lights -->
  <circle cx="240" cy="59" r="5" fill="#f85149"/>
  <circle cx="258" cy="59" r="5" fill="#d29922"/>
  <circle cx="276" cy="59" r="5" fill="#3fb950"/>
  <!-- Filename tab -->
  <text x="296" y="63" font-family="'Courier New',Courier,monospace" font-size="11" fill="#6e7a91">useTypingEngine.ts</text>

  <!-- Code content — line 1 -->
  <g font-family="'Courier New',Courier,monospace" font-size="14">
    <!-- line numbers -->
    <text x="236" y="95"  fill="#3a4560" font-size="12">1</text>
    <text x="236" y="118" fill="#3a4560" font-size="12">2</text>
    <text x="236" y="141" fill="#3a4560" font-size="12">3</text>

    <!-- line 1: fully typed (green) -->
    <text x="258" y="95">
      <tspan fill="#bc8cff">export</tspan>
      <tspan fill="#c9d1d9"> </tspan>
      <tspan fill="#bc8cff">function</tspan>
      <tspan fill="#c9d1d9"> </tspan>
      <tspan fill="#58a6ff">useTypingEngine</tspan>
      <tspan fill="#c9d1d9">()</tspan>
      <tspan fill="#c9d1d9"> {</tspan>
    </text>

    <!-- line 2: partially typed with cursor -->
    <text x="258" y="118">
      <tspan fill="#3fb950">  const </tspan>
      <tspan fill="#3fb950">session</tspan>
      <tspan fill="#3fb950"> = </tspan>
      <tspan fill="#3fb950">ref</tspan>
      <tspan fill="#3fb950">(</tspan>
      <!-- cursor block -->
      <tspan fill="#0c1018" style="background:#58a6ff">n</tspan>
      <tspan fill="#3a4560">ull)</tspan>
    </text>
    <!-- cursor bar -->
    <rect x="392" y="103" width="9" height="16" fill="#58a6ff" opacity="0.85" rx="1"/>
    <text x="392" y="118" fill="#0c1018" font-family="'Courier New',Courier,monospace" font-size="14">n</text>

    <!-- line 3: not yet typed (dim) -->
    <text x="258" y="141">
      <tspan fill="#3a4560">  return { session, start, stop }</tspan>
    </text>
  </g>

  <!-- ── Stats pills (right side of editor) ──────────────── -->
  <!-- WPM pill -->
  <rect x="800" y="90" width="100" height="32" rx="6" fill="#161c2e" stroke="#1c2438"/>
  <text x="850" y="111" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#6e7a91">WPM</text>
  <text x="850" y="108" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#6e7a91" dy="0">WPM</text>
  <!-- Better layout for pill -->
  <text x="815" y="108" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#6e7a91">WPM</text>
  <text x="855" y="108" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#58a6ff">87</text>

  <!-- ACC pill -->
  <rect x="910" y="90" width="100" height="32" rx="6" fill="#161c2e" stroke="#1c2438"/>
  <text x="922" y="108" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#6e7a91">ACC</text>
  <text x="964" y="108" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#3fb950">98%</text>

  <!-- ── Main heading ──────────────────────────────────────── -->
  <text x="600" y="218" text-anchor="middle"
        font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="62" font-weight="800" letter-spacing="-2"
        fill="url(#titleGrad)" filter="url(#glow)">Code Typewriter</text>

  <!-- Tagline -->
  <text x="600" y="256" text-anchor="middle"
        font-family="system-ui,-apple-system,sans-serif"
        font-size="19" fill="#6e7a91" letter-spacing="0.2">
    Type real source code. Build real muscle memory.
  </text>

  <!-- ── Feature pills row ──────────────────────────────────── -->
  <!-- Pill helper — each pill: rect + text -->

  <!-- Shiki Highlighting -->
  <rect x="224" y="290" width="170" height="30" rx="15" fill="#161c2e" stroke="#2a3555"/>
  <text x="309" y="310" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#c9d1d9">✦ Syntax Highlighting</text>

  <!-- Live WPM / Accuracy -->
  <rect x="406" y="290" width="160" height="30" rx="15" fill="#161c2e" stroke="#2a3555"/>
  <text x="486" y="310" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#c9d1d9">⚡ Live WPM &amp; CPM</text>

  <!-- GitHub fetch -->
  <rect x="578" y="290" width="150" height="30" rx="15" fill="#161c2e" stroke="#2a3555"/>
  <text x="653" y="310" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#c9d1d9">⬡ GitHub Snippets</text>

  <!-- Session history -->
  <rect x="740" y="290" width="150" height="30" rx="15" fill="#161c2e" stroke="#2a3555"/>
  <text x="815" y="310" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#c9d1d9">◈ Session History</text>

  <!-- No backend -->
  <rect x="902" y="290" width="118" height="30" rx="15" fill="#161c2e" stroke="#2a3555"/>
  <text x="961" y="310" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#c9d1d9">◻ No Backend</text>

  <!-- ── Language tags ──────────────────────────────────────── -->
  <g font-family="'Courier New',Courier,monospace" font-size="12">
    <text x="600" y="354" text-anchor="middle" fill="#3a4560">
      <tspan fill="#58a6ff">Vue</tspan>
      <tspan fill="#3a4560">  ·  </tspan>
      <tspan fill="#3fb950">Nuxt</tspan>
      <tspan fill="#3a4560">  ·  </tspan>
      <tspan fill="#58a6ff">TypeScript</tspan>
      <tspan fill="#3a4560">  ·  </tspan>
      <tspan fill="#bc8cff">React</tspan>
      <tspan fill="#3a4560">  ·  </tspan>
      <tspan fill="#3fb950">Python</tspan>
      <tspan fill="#3a4560">  ·  </tspan>
      <tspan fill="#58a6ff">Go</tspan>
      <tspan fill="#3a4560">  ·  </tspan>
      <tspan fill="#f85149">Rust</tspan>
      <tspan fill="#3a4560">  ·  </tspan>
      <tspan fill="#d29922">Java</tspan>
      <tspan fill="#3a4560">  ·  </tspan>
      <tspan fill="#3fb950">Spring Boot</tspan>
    </text>
  </g>

  <!-- Bottom accent bar -->
  <rect y="397" width="1200" height="3" fill="url(#topBar)"/>
</svg>
