name: Language request
description: Request support for a new language or additional snippets.
title: 'ISSUE-000: feat: add '
labels: ['language', 'enhancement']
body:
  - type: input
    id: language
    attributes:
      label: Language or framework
      placeholder: Kotlin, Ruby, Svelte, Laravel
    validations:
      required: true
  - type: input
    id: extension
    attributes:
      label: File extension
      placeholder: .kt
    validations:
      required: true
  - type: textarea
    id: repositories
    attributes:
      label: Suggested repositories
      description: List reputable open-source projects with representative source files.
      placeholder: |
        - https://github.com/owner/repo
        - https://github.com/owner/another-repo
    validations:
      required: true
  - type: textarea
    id: snippets
    attributes:
      label: Suggested raw file URLs
      description: Prefer raw.githubusercontent.com URLs pinned to a commit SHA or release tag.
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Mention syntax concerns, common file types, or why this language would be useful.
